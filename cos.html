<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coșul tău | Boutique Kastel</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0a464e">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="utility-bar">
  <div class="wrap">
    <span>Bulevardul Libertății 6, Hunedoara</span>
    <a href="tel:0744377651">0744 377 651</a>
  </div>
</div>

<header class="site-header">
  <div class="header-wrap">
    <a href="index.html" class="logo">
      <span class="mark">BK</span>
      <span class="word">Boutique Kastel<span>DUTY FREE CONCEPT</span></span>
    </a>
    <nav class="main-nav">
      <a href="parfumuri.html">Parfumuri</a>
      <a href="index.html#categorii">Parfumuri niche</a>
      <a href="index.html#categorii">Îngrijire corporală</a>
      <a href="index.html#categorii">Băuturi</a>
      <a href="index.html#categorii">Dulciuri &amp; cafea</a>
      <a href="index.html#categorii">Diverse</a>
    </nav>
    <div class="header-icons">
      <a href="cos.html" class="cart-btn nav-active" aria-label="Coș">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>
        <span class="cart-badge" id="cartCount">0</span>
      </a>
    </div>
  </div>
</header>

<main class="cart-main section-inner">
  <h1>Coșul tău</h1>
  <div id="cartContents"></div>
</main>

<footer class="site-footer-simple">
  <div class="footer-inner">
    <span>© 2026 Boutique Kastel. Toate drepturile rezervate.</span>
    <a href="index.html">kastelboutique.ro</a>
  </div>
</footer>

<script src="cart.js"></script>
<script>
function formatPrice(p) { return `${p.toFixed(2).replace('.', ',')} Lei`; }

function renderCart() {
  const cart = getCart();
  const el = document.getElementById('cartContents');

  if (cart.length === 0) {
    el.innerHTML = '<p class="cart-empty">Coșul tău este gol. <a href="parfumuri.html">Vezi parfumurile</a></p>';
    return;
  }

  el.innerHTML = `
    <div class="cart-items">
      ${cart.map((item) => `
        <div class="cart-item">
          <img src="${item.image}" alt="${item.name}">
          <div class="cart-item-info">
            <h4>${item.name}</h4>
            <span>${formatPrice(item.price)} × ${item.qty}</span>
          </div>
          <span class="cart-item-total">${formatPrice(item.price * item.qty)}</span>
          <button class="cart-item-remove" data-cod="${item.cod}" aria-label="Elimină">✕</button>
        </div>
      `).join('')}
    </div>
    <div class="cart-summary">
      <span>Total</span>
      <strong>${formatPrice(cartTotal())}</strong>
    </div>
    <button class="btn btn-cart" id="checkoutBtn" disabled title="Plata online va fi disponibilă în curând">Finalizează comanda</button>
    <p class="cart-note">Plata online va fi disponibilă în curând. Pentru comenzi, sună la <a href="tel:0744377651">0744 377 651</a>.</p>
  `;

  el.querySelectorAll('.cart-item-remove').forEach((btn) => {
    btn.addEventListener('click', () => {
      removeFromCart(btn.dataset.cod);
      renderCart();
    });
  });
}

renderCart();
</script>
</body>
</html>
