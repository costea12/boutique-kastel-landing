<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panou comenzi | Boutique Kastel</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0a464e">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header admin-header">
  <div class="header-wrap">
    <a href="index.html" class="logo">
      <span class="mark">BK</span>
    </a>
    <span class="admin-header-title">Panou comenzi</span>
  </div>
</header>

<main class="account-main">
  <div class="account-box account-box-narrow" id="adminLoggedOut">
    <h1 class="admin-h1">Autentificare</h1>
    <form id="adminLoginForm" class="account-form">
      <label>
        <span>Adresă de e-mail</span>
        <input type="email" id="adminEmail" name="email" autocomplete="email" required>
      </label>
      <label>
        <span>Parolă</span>
        <input type="password" id="adminPassword" name="password" autocomplete="current-password" required>
      </label>
      <p class="account-error" id="adminLoginError" hidden></p>
      <button type="submit" class="btn btn-gold">Autentificare</button>
    </form>
  </div>

  <div class="account-box-narrow" id="adminNoAccess" hidden>
    <p class="account-error">Acest cont nu are acces la panoul de comenzi.</p>
  </div>

  <div class="admin-dashboard" id="adminPanel" hidden>
    <aside class="admin-sidebar">
      <nav class="admin-sidebar-nav">
        <button type="button" class="admin-sidebar-link is-active" data-section="orders">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>
          <span>Comenzi</span>
          <span class="admin-sidebar-badge" id="badgeOrders" hidden>0</span>
        </button>
        <button type="button" class="admin-sidebar-link" data-section="returns">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          <span>Cereri de retur</span>
          <span class="admin-sidebar-badge" id="badgeReturns" hidden>0</span>
        </button>
      </nav>
      <button type="button" class="btn-text admin-sidebar-logout" id="adminLogoutBtn">Deconectare</button>
    </aside>

    <div class="admin-content">
      <section class="admin-panel-section is-active" id="section-orders">
        <h2 class="admin-section-title">Comenzi</h2>
        <div class="admin-orders" id="adminOrdersList"></div>
        <p class="admin-orders-empty" id="adminOrdersEmpty" hidden>Nicio comandă momentan.</p>
      </section>

      <section class="admin-panel-section" id="section-returns">
        <h2 class="admin-section-title">Cereri de retur</h2>
        <div class="admin-orders" id="adminReturnsList"></div>
        <p class="admin-orders-empty" id="adminReturnsEmpty" hidden>Nicio cerere de retur momentan.</p>
      </section>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="panou-admin.js"></script>
</body>
</html>
