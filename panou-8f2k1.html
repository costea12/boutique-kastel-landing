<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://unpkg.com https://mny.ro https://cdn.jsdelivr.net; style-src 'self' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: https://images.unsplash.com https://res.cloudinary.com https://*.tile.openstreetmap.org; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://mny.ro https://api.emailjs.com https://boutique-kastel-api.vercel.app; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panou control | Boutique Kastel</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0a464e">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header admin-header">
  <div class="header-wrap">
    <a href="index.html" class="logo">
      <span class="mark">BK</span>
    </a>
    <span class="admin-header-title">Panou control</span>
    <button type="button" class="btn-text admin-header-logout" id="adminLogoutBtn" hidden>Deconectare</button>
  </div>
</header>

<main class="account-main">
  <div class="account-box account-box-narrow" id="adminLoggedOut">
    <h1 class="admin-h1">Autentificare</h1>
    <form id="adminLoginForm" class="account-form">
      <label>
        <span>Adresă de e-mail</span>
        <input type="email" id="adminEmail" name="email" autocomplete="email" required>
      </label>
      <label>
        <span>Parolă</span>
        <input type="password" id="adminPassword" name="password" autocomplete="current-password" required>
      </label>
      <p class="account-error" id="adminLoginError" hidden></p>
      <button type="submit" class="btn btn-gold">Autentificare</button>
    </form>
  </div>

  <div class="account-box-narrow" id="adminNoAccess" hidden>
    <p class="account-error">Acest cont nu are acces la panoul de comenzi.</p>
  </div>

  <div class="admin-dashboard" id="adminPanel" hidden>
    <aside class="admin-sidebar">
      <nav class="admin-sidebar-nav">
        <button type="button" class="admin-sidebar-link is-active" data-section="orders">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>
          <span>Comenzi</span>
          <span class="admin-sidebar-badge" id="badgeOrders" hidden>0</span>
        </button>
        <button type="button" class="admin-sidebar-link" data-section="returns">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          <span>Cereri de retur</span>
          <span class="admin-sidebar-badge" id="badgeReturns" hidden>0</span>
        </button>
        <button type="button" class="admin-sidebar-link" data-section="products">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 7 12 3 4 7v10l8 4 8-4V7Z"/><path d="M4 7l8 4 8-4"/><path d="M12 11v10"/></svg>
          <span>Produse</span>
        </button>
      </nav>
    </aside>

    <div class="admin-content">
      <section class="admin-panel-section is-active" id="section-orders">
        <h2 class="admin-section-title">Comenzi</h2>
        <div class="admin-orders" id="adminOrdersList"></div>
        <p class="admin-orders-empty" id="adminOrdersEmpty" hidden>Nicio comandă momentan.</p>
      </section>

      <section class="admin-panel-section" id="section-returns">
        <h2 class="admin-section-title">Cereri de retur</h2>
        <div class="admin-orders" id="adminReturnsList"></div>
        <p class="admin-orders-empty" id="adminReturnsEmpty" hidden>Nicio cerere de retur momentan.</p>
      </section>

      <section class="admin-panel-section" id="section-products">
        <h2 class="admin-section-title">Produse</h2>

        <div class="admin-products-toolbar">
          <div class="admin-products-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="adminProductSearch" placeholder="Caută după nume sau brand…">
          </div>
          <select id="adminProductCategory">
            <option value="">Toate categoriile</option>
            <option value="PRF">Parfumuri</option>
            <option value="PRF-niche">Parfumuri niche</option>
            <option value="ICP">Îngrijire corporală</option>
            <option value="ALC">Băuturi</option>
            <option value="DLC">Dulciuri</option>
            <option value="CAF">Cafea</option>
          </select>
          <label class="admin-products-outofstock-toggle">
            <input type="checkbox" id="adminProductOutOnly">
            <span>Doar stoc epuizat</span>
          </label>
          <span class="admin-products-count" id="adminProductCount"></span>
          <button type="button" class="btn btn-gold admin-products-add-btn" id="adminAddProductBtn">+ Produs nou</button>
        </div>

        <div class="admin-products-grid" id="adminProductsGrid"></div>
        <p class="admin-orders-empty" id="adminProductsEmpty" hidden>Niciun produs găsit.</p>
        <p class="admin-orders-empty" id="adminProductsLoading">Se încarcă produsele…</p>
      </section>

      <div class="admin-modal-overlay" id="adminProductModalOverlay" hidden>
        <div class="admin-modal">
          <button type="button" class="admin-modal-close" id="adminProductModalClose" aria-label="Închide">✕</button>
          <h2 id="adminProductModalTitle">Produs nou</h2>
          <form id="adminProductForm" class="account-form">
            <label>
              <span>Cod produs</span>
              <input type="text" id="apCod" required>
            </label>
            <label>
              <span>Nume produs</span>
              <input type="text" id="apName" required>
            </label>
            <label>
              <span>Brand</span>
              <input type="text" id="apBrand">
            </label>
            <label>
              <span>Categorie</span>
              <select id="apCategory" required>
                <option value="PRF">Parfumuri</option>
                <option value="PRF-niche">Parfumuri niche</option>
                <option value="ICP">Îngrijire corporală</option>
                <option value="ALC">Băuturi</option>
                <option value="DLC">Dulciuri</option>
                <option value="CAF">Cafea</option>
              </select>
            </label>
            <label>
              <span>Preț (Lei)</span>
              <input type="number" id="apPrice" min="0" step="0.01" required>
            </label>
            <label>
              <span>Stoc</span>
              <input type="number" id="apStock" min="0" step="1" required>
            </label>
            <label>
              <span>Poză produs</span>
              <input type="file" id="apImage" accept="image/*">
            </label>
            <img id="apImagePreview" class="admin-modal-preview" hidden>
            <p class="account-error" id="adminProductFormError" hidden></p>
            <button type="submit" class="btn btn-gold" id="adminProductFormSubmit">Salvează produsul</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="search-utils.js"></script>
<script src="panou-admin.js"></script>
</body>
</html>
